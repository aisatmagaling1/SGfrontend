<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("rh-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<title>Change password · Request Hub</title>
</head>
<body>
  <main class="auth">
    <section class="auth-brand">
      <div class="logo-card"><img src="/img/logo.png" alt="Steniel Graham Packaging Philippines Corporation"></div>
      <p class="brand-line">Requests, approvals and records for Steniel Graham staff.</p>
    </section>
    <section class="auth-panel">
      <button type="button" class="icon-btn theme-corner" data-theme-toggle></button>
      <form class="auth-form" id="form" novalidate>
        <h1>Choose a new password</h1>
        <p class="sub">You are using a temporary password. Set your own to continue.</p>
        <div id="msg" class="msg" role="alert" hidden></div>
        <div class="field">
          <label for="current">Current password</label>
          <div class="pw-wrap"><input id="current" type="password" autocomplete="current-password" required data-eye></div>
        </div>
        <div class="field">
          <label for="next">New password</label>
          <div class="pw-wrap"><input id="next" type="password" autocomplete="new-password" minlength="8" required data-eye></div>
          <span class="hint">At least 8 characters.</span>
        </div>
        <div class="field">
          <label for="again">Repeat new password</label>
          <div class="pw-wrap"><input id="again" type="password" autocomplete="new-password" required data-eye></div>
        </div>
        <button class="btn btn-primary btn-block" id="submit" type="submit">Save password</button>
      </form>
    </section>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      await RH.requireUser({ allowMustChange: true });
      const form = document.getElementById('form');
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submit');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.hidden = true;
        const currentPassword = document.getElementById('current').value;
        const newPassword = document.getElementById('next').value;
        if (newPassword.length < 8) { RH.showMsg(msg, 'Use a new password with at least 8 characters.', 'error'); return; }
        if (newPassword !== document.getElementById('again').value) { RH.showMsg(msg, 'The two new passwords do not match.', 'error'); return; }
        btn.disabled = true; btn.textContent = 'Saving…';
        try {
          await RH.api('/auth/change-password', { method: 'POST', body: { currentPassword, newPassword } });
          location.replace('/dashboard.html');
        } catch (err) {
          RH.showMsg(msg, err.message, 'error');
          btn.disabled = false; btn.textContent = 'Save password';
        }
      });
    })();
  </script>
</body>
</html>
